<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Pesten Card Game</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <div class="game-container">
        <h1>Simple Pesten Card Game</h1>
        
        <div class="game-area">
            <div class="opponent-hand" id="opponent-hand"></div>
            
            <div class="play-area">
                <div class="deck" id="deck"></div>
                <div class="pile" id="pile">?</div>
            </div>
            
            <div class="player-hand" id="player-hand"></div>
            
            <div class="status" id="status">Game started! It's your turn.</div>
        </div>
        
        <div class="winner hidden" id="winner">
            <h2 id="winner-text">You Win!</h2>
            <button id="play-again">Play Again</button>
        </div>
    </div>

    
</body>
</html>
